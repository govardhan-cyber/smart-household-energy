<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes glowPulse {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 4px #00f2fe); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #10b981); }
      }
      .pulse-line { animation: glowPulse 4s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="0" y="1" width="1200" height="4" rx="2" fill="url(#dividerGrad)" class="pulse-line"/>
</svg>
