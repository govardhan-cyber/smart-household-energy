<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="auto" style="background:#090d16; border-radius: 16px; overflow: hidden;">
  <defs>
    <linearGradient id="cardGlowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardGlowGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardGlowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardGlowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.02"/>
    </linearGradient>

    <style>
      @keyframes pulseRing {
        0% { stroke-dashoffset: 283; }
        50% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 283; }
      }
      @keyframes shimmerText {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px rgba(255,255,255,0.2)); }
        50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(0,242,254,0.6)); }
      }
      @keyframes scanWave {
        0% { transform: scaleY(0.7); }
        50% { transform: scaleY(1.3); }
        100% { transform: scaleY(0.7); }
      }
      .gauge-circle {
        stroke-dasharray: 283;
        stroke-dashoffset: 25;
        transform-origin: 50% 50%;
        animation: pulseRing 8s ease-in-out infinite;
      }
      .shimmer { animation: shimmerText 3s ease-in-out infinite; }
      .bar-anim-1 { animation: scanWave 2s ease-in-out infinite; transform-origin: bottom; }
      .bar-anim-2 { animation: scanWave 2.4s ease-in-out infinite 0.3s; transform-origin: bottom; }
      .bar-anim-3 { animation: scanWave 1.8s ease-in-out infinite 0.6s; transform-origin: bottom; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 12px; fill: #94a3b8; }
      .val { font-family: 'SF Mono', Consolas, monospace; font-weight: 800; font-size: 26px; }
    </style>
  </defs>

  <rect width="1200" height="200" fill="#060911"/>

  <!-- Card 1: Diagnostic Health -->
  <g transform="translate(24, 20)">
    <rect width="270" height="160" rx="14" fill="url(#cardGlowCyan)" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.3"/>
    <text x="24" y="38" class="title" fill="#e2e8f0" font-size="14">AI AUDIT ACCURACY</text>
    <text x="24" y="56" class="sub">Appliance footprint scoring</text>
    
    <text x="24" y="112" class="val shimmer" fill="#00f2fe">98.4%</text>
    <text x="24" y="136" class="sub" fill="#38bdf8">✓ Neural Calibrated</text>

    <!-- Mini Radial Indicator -->
    <g transform="translate(210, 85)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" class="gauge-circle"/>
      <circle cx="0" cy="0" r="4" fill="#00f2fe"/>
    </g>
  </g>

  <!-- Card 2: Projected Savings -->
  <g transform="translate(318, 20)">
    <rect width="270" height="160" rx="14" fill="url(#cardGlowGreen)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3"/>
    <text x="24" y="38" class="title" fill="#e2e8f0" font-size="14">ESTIMATED SAVINGS</text>
    <text x="24" y="56" class="sub">Annual household reduction</text>
    
    <text x="24" y="112" class="val shimmer" fill="#10b981">₹24,500+</text>
    <text x="24" y="136" class="sub" fill="#34d399">▲ ~34% Tariff Cut</text>

    <!-- Mini Wave Bars -->
    <g transform="translate(195, 120)">
      <rect x="0" y="-30" width="8" height="30" rx="3" fill="#10b981" class="bar-anim-1"/>
      <rect x="14" y="-45" width="8" height="45" rx="3" fill="#34d399" class="bar-anim-2"/>
      <rect x="28" y="-22" width="8" height="22" rx="3" fill="#10b981" class="bar-anim-3"/>
      <rect x="42" y="-38" width="8" height="38" rx="3" fill="#059669" class="bar-anim-1"/>
    </g>
  </g>

  <!-- Card 3: Solar ROI Horizon -->
  <g transform="translate(612, 20)">
    <rect width="270" height="160" rx="14" fill="url(#cardGlowAmber)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.3"/>
    <text x="24" y="38" class="title" fill="#e2e8f0" font-size="14">SOLAR ROI TIMELINE</text>
    <text x="24" y="56" class="sub">Compound 25-yr amortization</text>
    
    <text x="24" y="112" class="val shimmer" fill="#f59e0b">4.2 YRS</text>
    <text x="24" y="136" class="sub" fill="#fbbf24">★ Break-Even Payback</text>

    <!-- Sun & Ray Icon -->
    <g transform="translate(210, 95)">
      <circle cx="0" cy="0" r="16" fill="#f59e0b" fill-opacity="0.3"/>
      <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
      <path d="M 0 -22 L 0 -18 M 0 18 L 0 22 M -22 0 L -18 0 M 18 0 L 22 0 M -15 -15 L -12 -12 M 12 12 L 15 15 M -15 12 L -12 9 M 12 -12 L 15 -15" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Card 4: Test Suite & Quality -->
  <g transform="translate(906, 20)">
    <rect width="270" height="160" rx="14" fill="url(#cardGlowPurple)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.3"/>
    <text x="24" y="38" class="title" fill="#e2e8f0" font-size="14">TEST VERIFICATION</text>
    <text x="24" y="56" class="sub">Vitest &amp; ESLint test suites</text>
    
    <text x="24" y="112" class="val shimmer" fill="#a78bfa">78 / 78</text>
    <text x="24" y="136" class="sub" fill="#c4b5fd">🛡 0 ESLint Errors</text>

    <!-- Shield Icon -->
    <g transform="translate(210, 95)">
      <path d="M 0 -24 L 20 -15 L 20 6 C 20 18, 0 26, 0 26 C 0 26, -20 18, -20 6 L -20 -15 Z" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M -6 2 L -1 7 L 8 -4" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
