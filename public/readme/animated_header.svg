<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 420"
  width="100%"
  height="auto"
  style="
    background:#05070c;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
  "
>
  <defs>

    <!-- ========================================================= -->
    <!-- BACKGROUND -->
    <!-- ========================================================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050a"/>
      <stop offset="45%" stop-color="#071016"/>
      <stop offset="100%" stop-color="#03060b"/>
    </linearGradient>

    <radialGradient id="cyanAmbient">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#00bcd4" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#00bcd4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenAmbient">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".20"/>
      <stop offset="45%" stop-color="#059669" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="greenText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glass -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".105"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>

    <!-- Energy flow -->
    <linearGradient id="energyLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- ========================================================= -->
    <!-- FILTERS -->
    <!-- ========================================================= -->

    <filter id="blur40">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <filter id="blur18">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ========================================================= -->
    <!-- GRID -->
    <!-- ========================================================= -->

    <pattern
      id="grid"
      width="36"
      height="36"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M36 0H0V36"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".035"
      />

      <circle
        cx="0"
        cy="0"
        r="1"
        fill="#38bdf8"
        fill-opacity=".12"
      />
    </pattern>

    <!-- ========================================================= -->
    <!-- MASK -->
    <!-- ========================================================= -->

    <linearGradient id="fadeRight">
      <stop offset="0%" stop-color="white"/>
      <stop offset="75%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>

    <mask id="rightFade">
      <rect width="1200" height="420" fill="url(#fadeRight)"/>
    </mask>

    <!-- ========================================================= -->
    <!-- ANIMATIONS -->
    <!-- ========================================================= -->

    <style>

      .font {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      .mono {
        font-family:
          "SF Mono",
          "Cascadia Code",
          Consolas,
          monospace;
      }

      @keyframes flow {
        to {
          stroke-dashoffset:-180;
        }
      }

      @keyframes pulse {
        0%,100% {
          opacity:.45;
          transform:scale(.85);
        }

        50% {
          opacity:1;
          transform:scale(1.25);
        }
      }

      @keyframes float {
        0%,100% {
          transform:translateY(0);
        }

        50% {
          transform:translateY(-7px);
        }
      }

      @keyframes rotate {
        from {
          transform:rotate(0deg);
        }

        to {
          transform:rotate(360deg);
        }
      }

      @keyframes scan {
        0% {
          transform:translateY(-20px);
          opacity:0;
        }

        20% {
          opacity:.5;
        }

        80% {
          opacity:.5;
        }

        100% {
          transform:translateY(440px);
          opacity:0;
        }
      }

      @keyframes blink {
        0%,100% {
          opacity:.35;
        }

        50% {
          opacity:1;
        }
      }

      .flow {
        stroke-dasharray:8 14;
        animation:flow 4s linear infinite;
      }

      .flowSlow {
        stroke-dasharray:4 18;
        animation:flow 7s linear infinite;
      }

      .pulse {
        animation:pulse 2.8s ease-in-out infinite;
        transform-box:fill-box;
        transform-origin:center;
      }

      .float {
        animation:float 5s ease-in-out infinite;
      }

      .rotate {
        animation:rotate 24s linear infinite;
        transform-origin:1010px 215px;
      }

      .blink {
        animation:blink 2s ease-in-out infinite;
      }

      .scan {
        animation:scan 7s linear infinite;
      }

    </style>

  </defs>


  <!-- =========================================================== -->
  <!-- BACKGROUND -->
  <!-- =========================================================== -->

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Ambient lighting -->
  <circle
    cx="180"
    cy="80"
    r="300"
    fill="url(#cyanAmbient)"
    filter="url(#blur18)"
  />

  <circle
    cx="930"
    cy="340"
    r="320"
    fill="url(#greenAmbient)"
    filter="url(#blur18)"
  />

  <!-- Subtle grid -->
  <rect width="1200" height="420" fill="url(#grid)"/>


  <!-- =========================================================== -->
  <!-- CINEMATIC LIGHT STREAK -->
  <!-- =========================================================== -->

  <rect
    x="0"
    y="-20"
    width="1200"
    height="3"
    fill="#22d3ee"
    opacity=".05"
    class="scan"
    filter="url(#blur18)"
  />


  <!-- =========================================================== -->
  <!-- ENERGY NETWORK -->
  <!-- =========================================================== -->

  <!-- Main energy route -->
  <path
    d="
      M-80 330
      C150 260 220 370 410 300
      C590 235 650 315 820 250
      C980 190 1060 220 1280 120
    "
    fill="none"
    stroke="#22d3ee"
    stroke-opacity=".07"
    stroke-width="12"
    filter="url(#blur18)"
  />

  <path
    d="
      M-80 330
      C150 260 220 370 410 300
      C590 235 650 315 820 250
      C980 190 1060 220 1280 120
    "
    fill="none"
    stroke="url(#energyLine)"
    stroke-width="2"
    class="flow"
  />

  <!-- Secondary network -->
  <path
    d="
      M-50 120
      C160 160 280 70 440 130
      C600 190 700 105 870 150
      C1010 188 1110 120 1260 160
    "
    fill="none"
    stroke="#38bdf8"
    stroke-opacity=".18"
    stroke-width="1.5"
    class="flowSlow"
  />

  <!-- Network nodes -->
  <g filter="url(#smallGlow)">

    <circle cx="220" cy="310" r="3" fill="#10b981"/>
    <circle cx="410" cy="300" r="3" fill="#22d3ee"/>
    <circle cx="650" cy="280" r="3" fill="#38bdf8"/>
    <circle cx="820" cy="250" r="3" fill="#10b981"/>
    <circle cx="1030" cy="205" r="3" fill="#22d3ee"/>

  </g>

  <!-- Pulse rings -->
  <circle
    cx="410"
    cy="300"
    r="8"
    fill="none"
    stroke="#22d3ee"
    stroke-opacity=".45"
    class="pulse"
  />

  <circle
    cx="820"
    cy="250"
    r="8"
    fill="none"
    stroke="#10b981"
    stroke-opacity=".45"
    class="pulse"
    style="animation-delay:1s"
  />


  <!-- =========================================================== -->
  <!-- LEFT ICON -->
  <!-- =========================================================== -->

  <g transform="translate(62 105)" class="float">

    <!-- glow -->
    <rect
      x="-8"
      y="-8"
      width="92"
      height="92"
      rx="25"
      fill="#22d3ee"
      opacity=".08"
      filter="url(#blur18)"
    />

    <!-- glass -->
    <rect
      width="76"
      height="76"
      rx="21"
      fill="url(#glass)"
      stroke="url(#glassBorder)"
      stroke-width="1"
    />

    <!-- inner highlight -->
    <rect
      x="1"
      y="1"
      width="74"
      height="74"
      rx="20"
      fill="none"
      stroke="#ffffff"
      stroke-opacity=".06"
    />

    <!-- energy bolt -->
    <path
      d="
        M43 12
        L23 40
        H37
        L34 63
        L57 33
        H43
        Z
      "
      fill="url(#cyanText)"
      filter="url(#smallGlow)"
    />

    <!-- tiny status -->
    <circle
      cx="62"
      cy="14"
      r="3"
      fill="#10b981"
      class="blink"
    />

  </g>


  <!-- =========================================================== -->
  <!-- HEADER -->
  <!-- =========================================================== -->

  <g transform="translate(170 91)">

    <!-- Status badges -->

    <g>

      <rect
        width="128"
        height="25"
        rx="12.5"
        fill="#10b981"
        fill-opacity=".08"
        stroke="#10b981"
        stroke-opacity=".28"
      />

      <circle
        cx="14"
        cy="12.5"
        r="3"
        fill="#34d399"
        class="blink"
      />

      <text
        x="25"
        y="17"
        fill="#6ee7b7"
        font-size="10"
        font-weight="700"
        letter-spacing="1"
        class="mono"
      >
        SYSTEM ONLINE
      </text>

    </g>


    <g transform="translate(138 0)">

      <rect
        width="116"
        height="25"
        rx="12.5"
        fill="#38bdf8"
        fill-opacity=".07"
        stroke="#38bdf8"
        stroke-opacity=".25"
      />

      <text
        x="13"
        y="17"
        fill="#7dd3fc"
        font-size="10"
        font-weight="700"
        letter-spacing="1"
        class="mono"
      >
        v26.0
      </text>

    </g>


    <!-- Main title -->

    <text
      x="0"
      y="76"
      fill="#f8fafc"
      font-size="43"
      font-weight="800"
      letter-spacing="-1.8"
      class="font"
    >
      SMART HOUSEHOLD
    </text>

    <text
      x="0"
      y="121"
      fill="url(#cyanText)"
      font-size="43"
      font-weight="800"
      letter-spacing="-1.8"
      class="font"
    >
      ENERGY
    </text>


    <!-- Description -->

    <text
      x="0"
      y="151"
      fill="#94a3b8"
      font-size="14.5"
      font-weight="400"
      class="font"
    >
      AI-powered energy auditing · solar intelligence · real-time copilot
    </text>


    <!-- ======================================================= -->
    <!-- FEATURE CARDS -->
    <!-- ======================================================= -->

    <g transform="translate(0 176)">

      <!-- Card 1 -->
      <g>

        <rect
          width="142"
          height="52"
          rx="10"
          fill="url(#glass)"
          stroke="url(#glassBorder)"
        />

        <text
          x="13"
          y="20"
          fill="#64748b"
          font-size="9"
          font-weight="700"
          letter-spacing="1"
          class="mono"
        >
          AUDIT ENGINE
        </text>

        <text
          x="13"
          y="39"
          fill="#e2e8f0"
          font-size="12"
          font-weight="600"
          class="font"
        >
          AI Energy Audit
        </text>

      </g>


      <!-- Card 2 -->
      <g transform="translate(152 0)">

        <rect
          width="142"
          height="52"
          rx="10"
          fill="url(#glass)"
          stroke="url(#glassBorder)"
        />

        <text
          x="13"
          y="20"
          fill="#64748b"
          font-size="9"
          font-weight="700"
          letter-spacing="1"
          class="mono"
        >
          SOLAR ENGINE
        </text>

        <text
          x="13"
          y="39"
          fill="#e2e8f0"
          font-size="12"
          font-weight="600"
          class="font"
        >
          25-Year ROI
        </text>

      </g>


      <!-- Card 3 -->
      <g transform="translate(304 0)">

        <rect
          width="142"
          height="52"
          rx="10"
          fill="url(#glass)"
          stroke="url(#glassBorder)"
        />

        <text
          x="13"
          y="20"
          fill="#64748b"
          font-size="9"
          font-weight="700"
          letter-spacing="1"
          class="mono"
        >
          COPILOT
        </text>

        <text
          x="13"
          y="39"
          fill="#e2e8f0"
          font-size="12"
          font-weight="600"
          class="font"
        >
          Gemini AI
        </text>

      </g>


      <!-- Card 4 -->
      <g transform="translate(456 0)">

        <rect
          width="142"
          height="52"
          rx="10"
          fill="url(#glass)"
          stroke="url(#glassBorder)"
        />

        <text
          x="13"
          y="20"
          fill="#64748b"
          font-size="9"
          font-weight="700"
          letter-spacing="1"
          class="mono"
        >
          QUALITY
        </text>

        <text
          x="13"
          y="39"
          fill="#34d399"
          font-size="12"
          font-weight="700"
          class="font"
        >
          78 / 78 PASSED
        </text>

      </g>

    </g>

  </g>


  <!-- =========================================================== -->
  <!-- RIGHT ENERGY CORE -->
  <!-- =========================================================== -->

  <g class="rotate" opacity=".75">

    <circle
      cx="1010"
      cy="215"
      r="106"
      fill="none"
      stroke="#22d3ee"
      stroke-opacity=".12"
      stroke-width="1"
      stroke-dasharray="3 14"
    />

    <circle
      cx="1010"
      cy="215"
      r="82"
      fill="none"
      stroke="#10b981"
      stroke-opacity=".18"
      stroke-width="1"
      stroke-dasharray="24 18"
    />

    <circle
      cx="1010"
      cy="215"
      r="60"
      fill="none"
      stroke="#38bdf8"
      stroke-opacity=".20"
      stroke-width="1"
      stroke-dasharray="2 9"
    />

  </g>


  <!-- Core glow -->

  <circle
    cx="1010"
    cy="215"
    r="80"
    fill="#22d3ee"
    opacity=".035"
    filter="url(#blur40)"
  />

  <!-- Core -->

  <g filter="url(#glow)">

    <circle
      cx="1010"
      cy="215"
      r="30"
      fill="#07151b"
      stroke="#22d3ee"
      stroke-opacity=".5"
    />

    <circle
      cx="1010"
      cy="215"
      r="21"
      fill="#0a2025"
      stroke="#10b981"
      stroke-opacity=".55"
    />

    <circle
      cx="1010"
      cy="215"
      r="5"
      fill="#67e8f9"
    />

  </g>


  <!-- Orbiting nodes -->

  <circle
    cx="1114"
    cy="215"
    r="4"
    fill="#22d3ee"
    filter="url(#smallGlow)"
  />

  <circle
    cx="906"
    cy="215"
    r="3"
    fill="#10b981"
    filter="url(#smallGlow)"
  />

  <circle
    cx="1010"
    cy="109"
    r="3"
    fill="#38bdf8"
    filter="url(#smallGlow)"
  />


  <!-- =========================================================== -->
  <!-- RIGHT METRIC PANEL -->
  <!-- =========================================================== -->

  <g transform="translate(890 330)">

    <rect
      width="240"
      height="48"
      rx="12"
      fill="#ffffff"
      fill-opacity=".035"
      stroke="#ffffff"
      stroke-opacity=".08"
    />

    <text
      x="15"
      y="19"
      fill="#64748b"
      font-size="9"
      font-weight="700"
      letter-spacing="1"
      class="mono"
    >
      ENERGY INTELLIGENCE
    </text>

    <text
      x="15"
      y="37"
      fill="#cbd5e1"
      font-size="11"
      class="font"
    >
      Monitor · Analyze · Optimize
    </text>

    <circle
      cx="217"
      cy="24"
      r="4"
      fill="#10b981"
      class="blink"
    />

  </g>


  <!-- =========================================================== -->
  <!-- TOP BORDER -->
  <!-- =========================================================== -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="1"
    fill="url(#cyanText)"
    opacity=".65"
  />

  <!-- Bottom vignette -->
  <rect
    x="0"
    y="395"
    width="1200"
    height="25"
    fill="#03050a"
    opacity=".35"
  />

</svg>
